name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: input
    id: feed
    attributes:
      label: Feed
      description: If the problem is specific to a GTFS feed, a link to it (or the catalog entry).
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Import …
        2. Open …
  - type: input
    id: environment
    attributes:
      label: Browser and version
